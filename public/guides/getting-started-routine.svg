<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" width="640" height="1010" role="img" aria-labelledby="t">
  <title id="t">Everyday routine in Jobtiva</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e1b4b; }
      .t { font-size: 25px; font-weight: 700; }
      .s { font-size: 21px; fill: #4b5563; }
      .l { font-size: 21px; font-weight: 700; fill: #4338ca; }
      .a { font-size: 21px; fill: #78350f; }
      .ah { font-size: 22px; font-weight: 700; fill: #78350f; }
      .box { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 2; }
      .q { fill: #ffffff; stroke: #6366f1; stroke-width: 3; }
      .alt { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 7 5; }
      .c { stroke: #6366f1; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="640" height="1010" fill="#ffffff"/>

  <rect class="box" x="10" y="10" width="370" height="84" rx="16"/>
  <text class="t" x="195" y="46" text-anchor="middle">Open Leads</text>
  <text class="s" x="195" y="76" text-anchor="middle">See what's new</text>
  <path class="c" d="M195 94 V136"/>

  <rect class="q" x="10" y="138" width="370" height="96" rx="16"/>
  <text class="t" x="195" y="178" text-anchor="middle">Is the job description</text>
  <text class="t" x="195" y="210" text-anchor="middle">there?</text>

  <path class="c" d="M380 186 H418"/>
  <text class="l" x="388" y="174">No</text>
  <rect class="alt" x="420" y="110" width="210" height="262" rx="16"/>
  <text class="ah" x="438" y="146">Add it yourself</text>
  <text class="a" x="438" y="184">Open the job link</text>
  <text class="a" x="438" y="214">and copy the</text>
  <text class="a" x="438" y="244">description.</text>
  <text class="a" x="438" y="284">Paste it into the</text>
  <text class="a" x="438" y="314">lead and save.</text>
  <path class="c" d="M525 372 V418 H382"/>

  <path class="c" d="M195 234 V376"/>
  <text class="l" x="207" y="310">Yes</text>

  <rect class="box" x="10" y="378" width="370" height="84" rx="16"/>
  <text class="t" x="195" y="414" text-anchor="middle">Read the AI summary</text>
  <text class="s" x="195" y="444" text-anchor="middle">and check the fit score</text>
  <path class="c" d="M195 462 V504"/>

  <rect class="box" x="10" y="506" width="370" height="84" rx="16"/>
  <text class="t" x="195" y="542" text-anchor="middle">Shortlist</text>
  <text class="s" x="195" y="572" text-anchor="middle">Keep the jobs worth your time</text>
  <path class="c" d="M195 590 V632"/>

  <rect class="box" x="10" y="634" width="370" height="84" rx="16"/>
  <text class="t" x="195" y="670" text-anchor="middle">Apply on the company's site</text>
  <text class="s" x="195" y="700" text-anchor="middle">Then update the job's stage</text>
  <path class="c" d="M195 718 V760"/>

  <rect class="box" x="10" y="762" width="370" height="104" rx="16"/>
  <text class="t" x="195" y="798" text-anchor="middle">Reach out</text>
  <text class="s" x="195" y="828" text-anchor="middle">Add the contact, draft with AI,</text>
  <text class="s" x="195" y="854" text-anchor="middle">edit it and send it yourself</text>
  <path class="c" d="M195 866 V908"/>

  <rect class="box" x="10" y="910" width="370" height="84" rx="16"/>
  <text class="t" x="195" y="946" text-anchor="middle">Follow up</text>
  <text class="s" x="195" y="976" text-anchor="middle">Check To-do and Reminders</text>
</svg>
