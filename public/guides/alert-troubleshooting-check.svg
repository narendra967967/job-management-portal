<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" aria-labelledby="t">
  <title id="t">Finding out what happened to a job alert</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e1b4b; }
      .t { font-size: 25px; font-weight: 700; }
      .s { font-size: 21px; fill: #4b5563; }
      .l { font-size: 22px; font-weight: 700; fill: #4338ca; }
      .box { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 2; }
      .q { fill: #ffffff; stroke: #6366f1; stroke-width: 3; }
      .no { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .c { stroke: #6366f1; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="640" height="590" fill="#ffffff"/>

  <rect class="box" x="10" y="10" width="620" height="84" rx="16"/>
  <text class="t" x="320" y="46" text-anchor="middle">Open Settings → Email log</text>
  <text class="s" x="320" y="76" text-anchor="middle">Set the dates to cover the alert</text>
  <path class="c" d="M320 94 V134"/>

  <rect class="q" x="60" y="136" width="520" height="84" rx="16"/>
  <text class="t" x="320" y="186" text-anchor="middle">Is the email listed?</text>

  <path class="c" d="M170 220 V290"/>
  <path class="c" d="M470 220 V290"/>
  <text class="l" x="150" y="264" text-anchor="end">No</text>
  <text class="l" x="490" y="264">Yes</text>

  <rect class="no" x="10" y="292" width="300" height="284" rx="16"/>
  <text class="t" x="160" y="334" text-anchor="middle">It never arrived</text>
  <text class="s" x="160" y="376" text-anchor="middle">Check your Gmail filter.</text>
  <text class="s" x="160" y="412" text-anchor="middle">Does its From text</text>
  <text class="s" x="160" y="442" text-anchor="middle">include this job site?</text>
  <text class="s" x="160" y="478" text-anchor="middle">Does it forward to</text>
  <text class="s" x="160" y="508" text-anchor="middle">your current address?</text>

  <rect class="box" x="330" y="292" width="300" height="284" rx="16"/>
  <text class="t" x="480" y="334" text-anchor="middle">It arrived</text>
  <text class="s" x="480" y="376" text-anchor="middle">Read its status and</text>
  <text class="s" x="480" y="406" text-anchor="middle">the line under it.</text>
  <text class="s" x="480" y="442" text-anchor="middle">Then use the table</text>
  <text class="s" x="480" y="472" text-anchor="middle">in this guide.</text>
</svg>
