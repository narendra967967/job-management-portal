# → /etc/fail2ban/filter.d/jobtiva-mail-in.conf
# Lines written by the mail receiver (scripts/mail-in.mjs), read from the
# systemd journal (docker-compose.yml logs mail-in with tag "mail-in"):
#   [mail-in] throttled ip=203.0.113.9                    (hit its own rate limit)
#   [mail-in] smtp error ip=203.0.113.9 code=ECONNRESET    (protocol/TLS errors)
# Unknown-address rejections are deliberately NOT matched: Gmail retries old
# addresses after a user resets theirs, and banning a Gmail server would break
# forwarding for everyone.

[Definition]
failregex = \[mail-in\] (?:throttled|smtp error) ip=<HOST>(?:\s|$)
ignoreregex =
journalmatch = CONTAINER_TAG=mail-in
