# Jobtiva on a single server (AWS EC2 t4g.small: 2 vCPU, 2 GB) — Postgres + the prod and preprod apps.
# Lives at /srv/jobtiva/docker-compose.yml (shipped by CI on every deploy).
#
# Not in git (create on the server — see deploy/VPS.md):
#   /srv/jobtiva/.env          ← compose vars: DB passwords + which image each app runs
#   /srv/jobtiva/env/prod.env  ← prod app env      (unquoted KEY=value lines)
#   /srv/jobtiva/env/preprod.env
#   /srv/jobtiva/env/mail-in.env  ← mail receiver env (only with the "mail" profile)
#
# Nothing here is reachable from the internet directly: the apps bind to
# 127.0.0.1 behind Nginx, and Postgres binds to 127.0.0.1 (SSH-tunnel only).
# The one exception is mail-in (SMTP port 25, email forwarding), which only
# starts when COMPOSE_PROFILES=mail is set in /srv/jobtiva/.env.

name: jobtiva

services:
  postgres:
    # Same major as the old RDS (18.x), so its dump restores cleanly.
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /srv/jobtiva/.env}
      # Read by postgres-init.sh on FIRST start only (empty data volume).
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD}
      PREPROD_DB_PASSWORD: ${PREPROD_DB_PASSWORD:?set PREPROD_DB_PASSWORD}
    # Sized for a 2 GB box: two apps × a 10-connection pool, plus headroom.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      # postgres:18+ keeps PGDATA under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  app-prod:
    image: ${PROD_IMAGE:-jobtiva:none}
    restart: unless-stopped
    # Optional to compose so `up -d postgres` works before prod exists;
    # deploy.sh refuses to deploy an env without its file.
    env_file:
      - path: ./env/prod.env
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads-prod:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 576m
    environment:
      # V8 sizes its heap from the container limit; give it room, but stay under the cap.
      NODE_OPTIONS: --max-old-space-size=320

  app-preprod:
    image: ${PREPROD_IMAGE:-jobtiva:none}
    restart: unless-stopped
    env_file:
      - path: ./env/preprod.env
        required: false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - uploads-preprod:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 448m
    environment:
      NODE_OPTIONS: --max-old-space-size=256

  # Email forwarding receiver (scripts/mail-in.mjs, docs/email-forwarding.md §6):
  # accepts mail for the in.* domains on port 25, spools it, and posts it to the
  # matching app over this private network. Runs from the prod app image;
  # deploy.sh moves it along with every prod deploy.
  mail-in:
    profiles: ["mail"]
    image: ${MAIL_IN_IMAGE:-jobtiva:none}
    restart: unless-stopped
    command: ["node", "scripts/mail-in.mjs"]
    env_file:
      - path: ./env/mail-in.env
        required: false
    environment:
      INBOUND_ROUTES: in.jobtiva.in=http://app-prod:3000,in.preprod.jobtiva.in=http://app-preprod:3000
      INBOUND_HOSTNAME: in.jobtiva.in
      INBOUND_SPOOL: /data/mail-spool
      # Copied out of /etc/letsencrypt by the certbot deploy hook (deploy/VPS.md),
      # readable by the container's non-root user.
      INBOUND_TLS_KEY: /tls/privkey.pem
      INBOUND_TLS_CERT: /tls/fullchain.pem
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "25:2525"
    volumes:
      - mail-spool:/data/mail-spool
      - ./mail-tls:/tls:ro
    mem_limit: 128m
    # Logs go to the system journal under a fixed tag, so fail2ban can watch
    # them (deploy/vps/fail2ban) whatever the container id. `docker compose
    # logs mail-in` still works.
    logging:
      driver: journald
      options:
        tag: mail-in

volumes:
  pgdata:
  uploads-prod:
  uploads-preprod:
  mail-spool:
