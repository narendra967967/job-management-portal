# → /etc/nginx/snippets/jobtiva-proxy.conf
# Shared proxy settings for every Jobtiva site. Included inside a location block.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (don't append to) X-Forwarded-For: a client-supplied value would
# otherwise reach the app and could be used to dodge per-IP rate limits.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
