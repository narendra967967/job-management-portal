# → /etc/nginx/sites-available/in.jobtiva.in.conf   (symlink into sites-enabled)
# The email-forwarding hosts (MX targets). Mail itself arrives on port 25 at
# the mail-in container, not through Nginx. This block exists only so Certbot
# can prove control of these names over HTTP (webroot) and get the TLS
# certificate mail-in uses for STARTTLS. Anything else gets a 404.
server {
    listen 80;
    listen [::]:80;
    server_name in.jobtiva.in in.preprod.jobtiva.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
