# → /etc/nginx/sites-available/jobtiva.in.conf   (symlink into sites-enabled)
# HTTP-only as committed; `certbot --nginx -d jobtiva.in -d www.jobtiva.in` adds the
# 443 blocks + the HTTP→HTTPS redirect in place.

# www → apex (one canonical origin; BETTER_AUTH_URL is https://jobtiva.in).
server {
    listen 80;
    listen [::]:80;
    server_name www.jobtiva.in;
    # Inside a location (not at server level) so Certbot's exact-match
    # /.well-known/acme-challenge/ location still wins during issuance/renewal.
    location / {
        return 301 https://jobtiva.in$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name jobtiva.in;

    # Résumé uploads are capped at 5 MB in the app; leave headroom for multipart.
    client_max_body_size 8m;

    # Live support chat (SSE): long-lived, unbuffered.
    location /api/support/ {
        proxy_pass http://127.0.0.1:3000;
        include snippets/jobtiva-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/jobtiva-proxy.conf;
    }
}
