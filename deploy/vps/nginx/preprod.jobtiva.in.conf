# → /etc/nginx/sites-available/preprod.jobtiva.in.conf   (symlink into sites-enabled)
# HTTP-only as committed; `certbot --nginx -d preprod.jobtiva.in` adds the 443
# block + the HTTP→HTTPS redirect in place.
server {
    listen 80;
    listen [::]:80;
    server_name preprod.jobtiva.in;

    # Keep preprod out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Résumé uploads are capped at 5 MB in the app; leave headroom for multipart.
    client_max_body_size 8m;

    # Internal mail-receiver endpoints — reached only over the Docker network.
    location /api/inbound/ {
        return 404;
    }

    # Live support chat (SSE): long-lived, unbuffered.
    location /api/support/ {
        proxy_pass http://127.0.0.1:3001;
        include snippets/jobtiva-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include snippets/jobtiva-proxy.conf;
    }
}
