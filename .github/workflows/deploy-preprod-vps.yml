name: Deploy preprod

on:
  push:
    branches: [preprod]
  workflow_dispatch:

# Shares the lock with the prod deploy — both write the same box's .env.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # The server is an ARM (Graviton t4g) EC2, so build arm64 images natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_key ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/vps_key\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Build, ship and deploy
        run: bash deploy/vps/ci-ship.sh preprod
